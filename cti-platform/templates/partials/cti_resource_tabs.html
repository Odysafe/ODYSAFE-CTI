{# Shared CTI resource tab bar — set active_tab: deepdarkcti | mitre-attack | ransomware-matrix #}
<div class="resource-selector" style="display: flex; gap: 0; margin-bottom: 40px; padding: 6px; background: rgba(139, 92, 246, 0.05); border-radius: 16px; border: 1px solid rgba(167, 139, 250, 0.1); overflow-x: auto; flex-wrap: nowrap;">
    <button type="button" class="resource-tab{% if active_tab == 'deepdarkcti' %} active{% endif %}" onclick="window.location.href='/cti-resources/deepdarkcti'" style="padding: 12px 20px; background: {% if active_tab == 'deepdarkcti' %}rgba(60, 60, 80, 0.8){% else %}transparent{% endif %}; border: none; border-radius: 12px; color: {% if active_tab == 'deepdarkcti' %}white{% else %}#9CA3AF{% endif %}; font-size: 15px; font-weight: {% if active_tab == 'deepdarkcti' %}600{% else %}500{% endif %}; cursor: pointer; white-space: nowrap; flex: 1; text-align: center;">
        DeepDarkCTI
    </button>
    <button type="button" class="resource-tab{% if active_tab == 'mitre-attack' %} active{% endif %}" onclick="window.location.href='/cti-resources/mitre-attack'" style="padding: 12px 20px; background: {% if active_tab == 'mitre-attack' %}rgba(60, 60, 80, 0.8){% else %}transparent{% endif %}; border: none; border-radius: 12px; color: {% if active_tab == 'mitre-attack' %}white{% else %}#9CA3AF{% endif %}; font-size: 15px; font-weight: {% if active_tab == 'mitre-attack' %}600{% else %}500{% endif %}; cursor: pointer; white-space: nowrap; flex: 1; text-align: center;">
        MITRE ATT&CK
    </button>
    <button type="button" class="resource-tab{% if active_tab == 'ransomware-matrix' %} active{% endif %}" onclick="window.location.href='/cti-resources/ransomware-matrix'" style="padding: 12px 20px; background: {% if active_tab == 'ransomware-matrix' %}rgba(60, 60, 80, 0.8){% else %}transparent{% endif %}; border: none; border-radius: 12px; color: {% if active_tab == 'ransomware-matrix' %}white{% else %}#9CA3AF{% endif %}; font-size: 15px; font-weight: {% if active_tab == 'ransomware-matrix' %}600{% else %}500{% endif %}; cursor: pointer; white-space: nowrap; flex: 1; text-align: center;">
        Ransomware Tool Matrix
    </button>
</div>
